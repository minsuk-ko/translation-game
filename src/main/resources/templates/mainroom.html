<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 대시보드</title>
  <style>
    /* 기존 스타일 유지 */
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
              45deg,
              rgba(0, 0, 0, 0.1) 0px,
              rgba(0, 0, 0, 0.1) 2px,
              transparent 2px,
              transparent 4px
      );
      pointer-events: none;
    }
    .dashboard {
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dashboard h1 {
      font-size: 2.5rem;
      margin-bottom: 3rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }
    .buttons {
      display: flex;
      gap: 2rem;
      justify-content: center;
    }
    .button {
      width: 180px;
      height: 180px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }
    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
              120deg,
              transparent,
              rgba(255, 255, 255, 0.2),
              transparent
      );
      transition: 0.5s;
    }
    .button:hover::before {
      left: 100%;
    }
    .button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.15);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    }
    .my-profile {
      background: linear-gradient(135deg, rgba(88, 43, 255, 0.2), rgba(88, 43, 255, 0.1));
    }
    .create-room {
      background: linear-gradient(135deg, rgba(41, 128, 185, 0.2), rgba(41, 128, 185, 0.1));
    }
    .join-room {
      background: linear-gradient(135deg, rgba(192, 57, 43, 0.2), rgba(192, 57, 43, 0.1));
    }
  </style>
</head>
<body>
<div class="dashboard">
  <h1>게임 대시보드</h1>
  <div class="buttons">
    <a href="mypage.html" class="button my-profile">
      <div class="icon">👤</div>
      내 정보
    </a>
    <a href="makeroom.html" class="button create-room">
      <div class="icon">🚪</div>
      방 만들기
    </a>
    <a href="joingame.html" class="button join-room">
      <div class="icon">🎮</div>
      방 참여하기
    </a>
  </div>
</div>
</body>
</html>
