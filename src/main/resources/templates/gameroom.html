<!DOCTYPE html>

<html>

<head>

    <title>Game Room</title>

    <style>

        body {

            margin: 0;

            font-family: 'Segoe UI', 'Arial', sans-serif;

            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);

            color: #fff;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            height: 100vh;

            overflow: hidden;

            position: relative;

        }

        .game-container {

            width: 90%;

            background: rgba(255, 255, 255, 0.05);

            border-radius: 20px;

            padding: 20px;

            box-shadow: 0 0 10px rgba(0,0,0,0.3);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }

        .player-list {

            display: flex;

            justify-content: space-around;

            flex-wrap: wrap;

            margin: 20px 0;

        }

        .player-card {

            text-align: center;

            margin: 10px;

            position: relative;

        }

        .player-avatar {

            width: 80px;

            height: 80px;

            background-color: #FFD700;

            border-radius: 10px;

            margin-bottom: 5px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

        }

        .player-id {

            font-size: 12px;

            color: #ccc;

        }

        .chat-bubble {

            position: absolute;

            bottom: 100%;

            left: 50%;

            transform: translateX(-50%);

            background: white;

            border: 2px solid #ccc;

            border-radius: 8px;

            padding: 5px 10px;

            margin-bottom: 10px;

            min-width: 100px;

            display: none;

        }

        .chat-bubble:after {

            content: '';

            position: absolute;

            bottom: -10px;

            left: 50%;

            transform: translateX(-50%);

            border-width: 5px;

            border-style: solid;

            border-color: white transparent transparent transparent;

        }

        .chat-input {

            width: 80%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 10px;

            margin: 10px 0;

            font-size: 16px;

        }

        .api-input {

            width: 80%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 10px;

            margin: 20px auto;

            display: block;

            font-size: 16px;

        }

        .topic-display {

            width: 80%;

            background: rgba(255, 255, 255, 0.1);

            padding: 15px;

            border-radius: 10px;

            text-align: center;

            font-size: 24px;

            margin: 20px 0;

            box-shadow: 0 0 10px rgba(0,0,0,0.3);

        }

        .score-display {

            width: 60px;

            height: 60px;

            background: rgba(255, 255, 255, 0.1);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            margin: 10px;

            position: relative;

        }

        .score-increase {

            position: absolute;

            top: -20px;

            font-size: 14px;

            color: #FFD700;

            opacity: 0;

            transition: opacity 0.5s ease;

        }

        .chat-window {

            width: 80%;

            height: 150px;

            background: rgba(255, 255, 255, 0.1);

            border-radius: 10px;

            overflow-y: auto;

            padding: 10px;

            box-shadow: 0 0 10px rgba(0,0,0,0.3);

            margin-top: 10px;

        }

        .chat-message {

            margin: 5px 0;

            font-size: 14px;

        }

    </style>

</head>

<body>

<div class="topic-display">주제: 예시 주제</div>

<div class="game-container">

    <div class="score-display">

        <span class="score-increase">+10</span>

        <span>0</span>

    </div>

    <div class="player-list">

        <div class="player-card">

            <div class="player-avatar">😊</div>

            <div class="player-id">00340</div>

        </div>

        <!-- 다른 플레이어 카드들 -->

    </div>

    <div class="chat-window"></div>

    <input type="text" class="chat-input" placeholder="채팅 입력...">

</div>

<script>

    document.addEventListener('DOMContentLoaded', function() {

        const chatInput = document.querySelector('.chat-input');

        const chatWindow = document.querySelector('.chat-window');

        const scoreDisplay = document.querySelector('.score-display span:last-child');

        const scoreIncrease = document.querySelector('.score-increase');

        let score = 0;

        function updateScore(points) {

            score += points;

            scoreDisplay.textContent = score;

            scoreIncrease.textContent = `+${points}`;

            scoreIncrease.style.opacity = 1;

            setTimeout(() => {

                scoreIncrease.style.opacity = 0;

            }, 1000);

        }

        chatInput.addEventListener('keypress', function(e) {

            if (e.key === 'Enter' && this.value.trim() !== '') {

                const message = document.createElement('div');

                message.className = 'chat-message';

                message.textContent = this.value;

                chatWindow.appendChild(message);

                chatWindow.scrollTop = chatWindow.scrollHeight;

                this.value = '';

                updateScore(10); // 채팅 입력 시 점수 업데이트

            }

        });

    });

</script>

</body>

</html>
